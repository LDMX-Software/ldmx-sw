
name: Build with CLANG using LTO sanitizer 

on:
  workflow_dispatch:
  push:
    branches: '**' #all branches
    tags: 'v*.*.*' #all version tags

env:
  LDMX_DOCKER_TAG: ldmx/dev:latest

jobs:
  build-clang-lto:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout ldmx-sw
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install just
      uses: extractions/setup-just@v3

    - name: Compile and Install ldmx-sw
      run: | 
        just install-denv init
        just configure-clang-lto-fail-on-warning build
        just test
