
name: PR Validation

on:
  workflow_dispatch:
  pull_request: 
    branches: [trunk]
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

env:
  LDMX_DOCKER_TAG: ldmx/dev:latest
  LDMX_NUM_EVENTS: 10000
  LDMX_LOG_LEVEL: 1
  REPORTS_REPO: LDMX-Software/validation-reports
  REPORTS_URL: https://ldmx-software.github.io/validation-reports

jobs:
  check-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post the workflow run for comment based trigger
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/run-validation') }}
        run: |
          COMMENT="The validation workflow is running here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"body": "'"$COMMENT"'"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"



  compile-ldmx-sw:
    needs: check-comment
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/run-validation'))
    runs-on: ubuntu-latest
    outputs:
      job_matrix: ${{steps.gen-mat.outputs.job_matrix}}
    steps:
    - name: Get PR Info
      id: get_pr
      if: github.event_name == 'issue_comment'
      run: |
        echo "HEAD_REF=refs/pull/${{ github.event.issue.number }}/merge" >> $GITHUB_ENV

    - name: Checkout ldmx-sw
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        ref: ${{ env.HEAD_REF }}

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: ccache-pr-${{ github.sha }}
        restore-keys: |
          ccache-pr-
 
    - name: Compile and Install ldmx-sw
      run: |
        just install-denv init configure-force-error
        just build
      shell: bash

    - name: Package ldmx-sw Into Artifact
      run: tar cf ldmx-sw-package.tar install/ .github/

    - name: Upload ldmx-sw Package
      uses: actions/upload-artifact@v7
      with:
        name: ldmx-sw-build-${{ github.sha }}
        path: ldmx-sw-package.tar

    - name: Generate Job Matrix
      id: gen-mat
      uses: ./.github/actions/generate-matrix

  validation:
    needs: compile-ldmx-sw
    runs-on: ubuntu-latest
    env:
      LDMX_RUN_NUMBER: ${{matrix.run}}
    strategy:
      matrix: ${{fromJson(needs.compile-ldmx-sw.outputs.job_matrix)}}
      fail-fast: false
    steps:

    - name: Get PR Info for Validation Job
      id: get_pr_again
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
          HEAD_REF=refs/pull/${{ github.event.issue.number }}/merge
          if [[ "$COMMENT_BODY" =~ /run-validation[[:space:]]+with[[:space:]]+([0-9]+)[[:space:]]+events ]]; then
            echo "LDMX_NUM_EVENTS=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          fi
        else
          HEAD_REF=${{ github.ref }}
        fi
        echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV

    # need clone of ldmx-sw for getting gold tag
    - name: Checkout ldmx-sw
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0
        ref: ${{ env.HEAD_REF }}
          
    - uses: extractions/setup-just@v4

    - run: just install-denv init

    - name: Download ldmx-sw Package
      uses: actions/download-artifact@v8
      with:
        name: ldmx-sw-build-${{ github.sha }}

    - name: Unpack ldmx-sw Build
      run: |
        cd ${GITHUB_WORKSPACE}
        tar xf ldmx-sw-package.tar

    - name: Download CI Gold Data
      uses: actions/checkout@v7
      with:
        repository: LDMX-Software/ci-data
        path: ci-data

    - name: Run Validation
      id: validation
      run: just run-validation ${{matrix.sample}}
      shell: bash

    - name: Upload Validation Plots
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.sample}}-pr-validation
        path: ${{ steps.validation.outputs.plots }}

    - name: Did any validation plots fail?
      id: check_result
      continue-on-error: true
      run: just check-validation "${{ steps.validation.outputs.plots }}" 2>&1 | tee check_output.txt
      shell: bash

    - name: Upload validation status
      if: always()
      run: |
        plots="${{ steps.validation.outputs.plots }}"
        if [[ "${{ steps.check_result.outcome }}" == "success" ]]; then
          echo "PASS" > status.txt
        else
          echo "FAIL" > status.txt
          # Append one line per failed histogram (for counting)
          if [[ -f "$plots" ]]; then
            tar -tf "$plots" | grep -c "fail/.*.pdf" >> status.txt || true
          fi
        fi

        # Extract and store check messages
        if [[ -f check_output.txt ]]; then
          # Extract error and warning messages, removing GitHub annotation prefixes
          grep -E '::(error|warning)::' check_output.txt | \
            sed -e 's/::error:://' -e 's/::warning:://' > check_messages.txt || true
          # Also include regular info messages about timing and log diffs
          grep -E '^(Timing for |Log character count differs|Timing within|Log message counts)' check_output.txt >> check_messages.txt || true
        fi

    - name: Upload status artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.sample }}-validation-status
        path: |
          status.txt
          check_messages.txt

    - name: Fail if validation failed
      if: steps.check_result.outcome == 'failure'
      run: exit 1

  post-validation:
    needs: [check-comment, validation]
    if: (!cancelled()) && (github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/run-validation')))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "PR_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          fi

      - name: Download all status artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-validation-status'
          merge-multiple: false
          path: statuses

      # trunk scripts on issue_comment, no PR code
      - name: Checkout report script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/validate
          path: ldmx-sw

      - name: Download all plot artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-pr-validation'
          merge-multiple: false
          path: plots

      - name: Build validation report
        continue-on-error: true
        run: |
          for dir in plots/*-pr-validation/; do
            sample=$(basename "$dir" -pr-validation)
            mkdir -p "report-input/${sample}"
            tar -xzf "${dir}${sample}_recon_validation_plots.tar.gz" -C "report-input/${sample}" \
              --wildcards 'results.json' 'fail/*.png' || echo "::warning::no report inputs for ${sample}"
            cp statuses/${sample}-validation-status/* "report-input/${sample}/" 2>/dev/null || true
          done
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          run_dir="pr-${PR_NUMBER}/run-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "RUN_DIR=${run_dir}" >> $GITHUB_ENV
          python3 ldmx-sw/.github/actions/validate/make_report.py report-input/* \
            --out "site/${run_dir}" \
            --title "ldmx-sw PR #${PR_NUMBER} validation" \
            --meta "<a href='${run_url}'>workflow run</a> (attempt ${{ github.run_attempt }}, ${{ github.event_name }})" \
            --base-url "${REPORTS_URL}/${run_dir}" \
            --comment-md worst.md
          python3 ldmx-sw/.github/actions/validate/make_report.py \
            --runs-index "site/pr-${PR_NUMBER}" --title "ldmx-sw PR #${PR_NUMBER} validation runs"

      - name: Upload validation report
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: site

      - name: Publish validation report
        continue-on-error: true
        id: publish
        env:
          DEPLOY_KEY: ${{ secrets.VALIDATION_REPORTS_DEPLOY_KEY }}
        run: |
          if [[ -z "${DEPLOY_KEY}" ]]; then
            echo "::warning::VALIDATION_REPORTS_DEPLOY_KEY not available, not publishing"
            exit 0
          fi
          if [[ -z "${RUN_DIR:-}" || ! -d "site/${RUN_DIR}" ]]; then
            echo "::warning::no report was built, not publishing"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/reports_key
          chmod 600 ~/.ssh/reports_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/reports_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          # retry on concurrent pushes
          for attempt in 1 2 3 4 5; do
            rm -rf reports
            git clone -q --depth 1 --branch gh-pages "git@github.com:${REPORTS_REPO}.git" reports
            rm -rf "reports/${RUN_DIR}"
            mkdir -p "reports/pr-${PR_NUMBER}"
            cp -r "site/${RUN_DIR}" "reports/${RUN_DIR}"
            python3 ldmx-sw/.github/actions/validate/make_report.py \
              --runs-index "reports/pr-${PR_NUMBER}" --title "ldmx-sw PR #${PR_NUMBER} validation runs"
            touch reports/.nojekyll
            git -C reports config user.name "github-actions[bot]"
            git -C reports config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C reports add -A
            git -C reports commit -q -m "PR #${PR_NUMBER} run ${{ github.run_id }}" || true
            if git -C reports push -q origin gh-pages; then
              echo "url=${REPORTS_URL}/${RUN_DIR}/" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $(( attempt * 15 ))
          done
          echo "::warning::could not push validation report"

      - name: Post validation summary comment
        env:
          REPORT_URL: ${{ steps.publish.outputs.url }}
        run: |
          # Fetch artifact list for this workflow run
          declare -A artifact_urls
          artifacts_json=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100")
          while IFS=$'\t' read -r aname aid; do
            artifact_urls[$aname]="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${aid}"
          done < <(echo "$artifacts_json" | jq -r '.artifacts[] | [.name, (.id|tostring)] | @tsv')

          passed=()
          failed=()
          declare -A reasons
          declare -A check_details
          for dir in statuses/*/; do
            sample=$(basename "$dir" -validation-status)
            mapfile -t lines < "$dir/status.txt"
            status="${lines[0]:-FAIL}"
            if [[ "$status" == "PASS" ]]; then
              passed+=("$sample")
            else
              failed+=("$sample")
              reasons[$sample]="${lines[1]:-0}"
            fi

            # Read check messages if available, only timing regressions go to the
            # comment, all timing lines stay on the report page
            if [[ -f "$dir/check_messages.txt" ]]; then
              check_details[$sample]=$(grep -vE '^(Timing for |Timing within |Timing anomaly for )' "$dir/check_messages.txt" | sed 's/^/- /' || true)
            fi
          done

          if [[ ${#failed[@]} -eq 0 ]]; then
            header="All validation samples passed! :white_check_mark:"
          else
            header="Some validation samples failed! :x:"
          fi

          table="| Sample | Status |\n|--------|--------|\n"
          for s in "${passed[@]}"; do
            table+="| \`$s\` | :white_check_mark: PASS |\n"
          done
          for s in "${failed[@]}"; do
            n="${reasons[$s]}"
            artifact_link=""
            artifact_name="${s}-pr-validation"
            if [[ -n "${artifact_urls[$artifact_name]:-}" ]]; then
              artifact_link=" ([artifact](${artifact_urls[$artifact_name]}))"
            fi
            if [[ "$n" -gt 0 ]]; then
              table+="| \`$s\` | :x: FAIL ($n histograms failed KS test)${artifact_link} |\n"
            else
              table+="| \`$s\` | :x: FAIL${artifact_link} |\n"
            fi
          done

          # Add details section for samples with check messages
          details_section=""
          all_samples=("${failed[@]}" "${passed[@]}")
          for s in "${all_samples[@]}"; do
            if [[ -n "${check_details[$s]:-}" ]]; then
              details_section+="\n**\`${s}\`:**\n${check_details[$s]}\n"
            fi
          done

          report_section=""
          if [[ -n "${REPORT_URL}" ]]; then
            header+="\n\n:bar_chart: **[Browse the validation report](${REPORT_URL})** (plots ranked by KS distance)"
          else
            header+="\n\nValidation report: \`validation-report\` artifact of [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          if [[ -s worst.md ]]; then
            report_section="\n### Worst histograms\n$(cat worst.md)\n"
          fi

          body="## Validation Results\n\n${header}\n\n${table}${report_section}${details_section}"

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$(printf '%b' "$body")" '{"body": $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments"

