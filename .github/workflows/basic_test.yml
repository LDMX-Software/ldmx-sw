
name: Basic Tests

on:
  push:
    branches: '**' #all branches
    tags: 'v*.*.*' #all version tags

env:
  LDMX_DOCKER_TAG: ldmx/dev:latest

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout ldmx-sw
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install just
      uses: extractions/setup-just@v3

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-basic-${{ github.sha }}
        restore-keys: |
          ccache-basic-

    - name: Compile and Install ldmx-sw
      run: | 
        just install-denv init configure-force-error
        just build
      shell: bash

    - name: Basic Tests for Functionality
      run: just test
      shell: bash
