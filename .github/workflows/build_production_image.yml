
name: Build Production Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git Reference to Build Into an Image'
        required: true
        default: trunk
      repo:
        description: 'Docker Repo to Push Image To'
        required: true
      tag:
        description: 'Name for Image'
        required: false
        default: edge
  push:
    branches: 'trunk'
    tags: 'v*.*.*' #all version tags

jobs:
  generate-image:
    runs-on: ubuntu-latest
    steps:
    -
      name: Setup QEMU
      uses: docker/setup-qemu-action@v3
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    -
      name: Set up just
      uses: extractions/setup-just@v3
      with:
        just-version: 1.26.0
    -
      name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    -
      name: Git Build Context
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        ref: ${{ github.event.inputs.branch }}
    -
      name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        # Default image name for push actions
        images: ${{ 'ldmx/pro' }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern=v{{version}}
          type=sha,format=short

    - 
      name: Update version variable before building
      run: just prep-version
    -
      name: Build the Image
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        tags: ${{ steps.generate_tag.outputs.tags }}
        push: true
        context: .

